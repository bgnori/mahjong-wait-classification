name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: "2"
      MATHLIB_NO_CACHE_ON_UPDATE: "1"
    defaults:
      run:
        working-directory: mahjong-wait-classification
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: mahjong-wait-classification
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: bgnori/mahjong-domain-core
          ref: main
          path: mahjong-domain-core
      - name: Record tested revisions
        run: |
          for repository in mahjong-domain-core mahjong-wait-classification; do
            printf '%s: %s\n' "$repository" "$(git -C "../$repository" rev-parse HEAD)" \
              >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Lean toolchain
        run: elan toolchain install "$(cat lean-toolchain)"
      - name: Fetch imported Mathlib cache
        run: |
          lake exe cache get $(find Mahjong MahjongTests ../mahjong-domain-core/MahjongDomain \
            -name '*.lean' -exec sed -n 's/^\(public \)\?import \(Mathlib\..*\)$/\2/p' {} + | sort -u)
      - name: Check migrated Pair declarations are absent
        run: |
          if grep -REn "^[[:space:]]*(@\\[[^]]+\\][[:space:]]*)*(namespace|inductive|structure|abbrev|def|theorem)[[:space:]]+(Toitsu|toDomainPair|ofDomainPair)[A-Za-z0-9_']*([[:space:]:.(]|$)" Mahjong; then
            echo "Obsolete local Pair declaration or conversion found" >&2
            exit 1
          fi
      - name: Build library and regression tests
        run: lake build Mahjong MahjongTests

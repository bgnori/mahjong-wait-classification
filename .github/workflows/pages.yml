name: Deploy computation reports to Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "scripts/build_pages.py"
      - "scripts/test_build_pages.py"
      - "web/**"
      - "reports/report-viewer.html"
      - "reports/four-tile-direct-report.json"
      - "reports/seven-tile-report.json"
      - "reports/ten-tile-report.json"
      - "reports/thirteen-tile-report.json"
  workflow_dispatch:
  workflow_run:
    workflows: ["Checks"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out CI page tools
        uses: actions/checkout@v6
        with:
          repository: bgnori/mahjong-domain-core
          ref: main
          path: _ci-tools
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Test Pages scripts
        run: |
          python3 -m unittest discover -s scripts -p 'test_build_pages.py'
          python3 -m unittest discover -s _ci-tools/scripts -p 'test_build_ci_page.py'
          python3 -m unittest discover -s _ci-tools/scripts -p 'test_collect_build_metrics.py'

      - name: Assemble static site
        run: |
          python3 scripts/build_pages.py _site
          python3 _ci-tools/scripts/build_ci_page.py _site
      - name: Collect this repository's metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 _ci-tools/scripts/collect_build_metrics.py _site/ci/data.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
